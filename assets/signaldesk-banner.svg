<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title description">
  <title id="title">SignalDesk</title>
  <desc id="description">Find the signal.</desc>
  <defs>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#52DDFF"/>
      <stop offset="0.5" stop-color="#947CFF"/>
      <stop offset="1" stop-color="#E957D7"/>
    </linearGradient>
    <linearGradient id="app-icon" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#726BEA"/>
      <stop offset="0.52" stop-color="#5B55D6"/>
      <stop offset="1" stop-color="#413BA9"/>
    </linearGradient>
    <pattern id="pixels" width="18" height="18" patternUnits="userSpaceOnUse">
      <rect x="2" y="3" width="2.2" height="2.2" fill="#FFFFFF" opacity="0.58"/>
      <rect x="12" y="11" width="1.3" height="1.3" fill="#FFFFFF" opacity="0.28"/>
    </pattern>
  </defs>

  <rect width="1280" height="360" rx="20" fill="#000000"/>

  <g>
    <circle cx="1120" cy="-45" r="380" fill="none" stroke="url(#pixels)" stroke-width="100" opacity="0.92"/>
    <circle cx="1120" cy="-45" r="290" fill="none" stroke="url(#arc)" stroke-width="48" opacity="0.96"/>
    <circle cx="1120" cy="-45" r="250" fill="url(#pixels)" opacity="0.62"/>
  </g>

  <g transform="translate(68 56)">
    <rect width="64" height="64" rx="16" fill="url(#app-icon)"/>
    <rect x="17" y="32" width="8" height="18" rx="4" fill="#FFFFFF" opacity="0.72"/>
    <rect x="28" y="15" width="8" height="35" rx="4" fill="#FFFFFF"/>
    <rect x="39" y="24" width="8" height="26" rx="4" fill="#FFFFFF" opacity="0.86"/>
  </g>
  <text x="153" y="102" fill="#F6F5F8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="44" font-weight="700" letter-spacing="-1.8">SignalDesk</text>
  <text x="68" y="274" fill="#F6F5F8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="82" font-weight="580" letter-spacing="-4.5">Find the signal.</text>
</svg>
