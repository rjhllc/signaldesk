<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title description">
  <title id="title">SignalDesk</title>
  <desc id="description">SignalDesk product banner</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171b3f"/>
      <stop offset="0.56" stop-color="#38328f"/>
      <stop offset="1" stop-color="#5b55d6"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9f9aff" stop-opacity="0.36"/>
      <stop offset="1" stop-color="#6e67ea" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#10132d" flood-opacity="0.42"/>
    </filter>
  </defs>
  <rect width="1280" height="360" rx="28" fill="url(#background)"/>
  <circle cx="1120" cy="46" r="300" fill="url(#glow)"/>
  <circle cx="104" cy="350" r="180" fill="#7d76ee" opacity="0.1"/>
  <g transform="translate(92 91)" filter="url(#shadow)">
    <rect width="178" height="178" rx="46" fill="#6c65e6"/>
    <rect x="47" y="83" width="18" height="50" rx="9" fill="#fff" opacity="0.7"/>
    <rect x="80" y="42" width="18" height="91" rx="9" fill="#fff"/>
    <rect x="113" y="63" width="18" height="70" rx="9" fill="#fff" opacity="0.86"/>
  </g>
  <g fill="#fff" font-family="Segoe UI, Inter, Arial, sans-serif">
    <text x="324" y="164" font-size="72" font-weight="750" letter-spacing="-2">SignalDesk</text>
    <text x="328" y="215" font-size="24" font-weight="500" opacity="0.82">Focused X research. Local control. Clear evidence.</text>
    <rect x="328" y="252" width="396" height="1" fill="#fff" opacity="0.24"/>
    <text x="328" y="291" font-size="16" font-weight="600" letter-spacing="2" opacity="0.66">WINDOWS DESKTOP RESEARCH</text>
  </g>
</svg>
