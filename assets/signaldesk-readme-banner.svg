<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title description">
  <title id="title">SignalDesk — filter the slop</title>
  <desc id="description">Clarified and curated X searches and filters.</desc>
  <defs>
    <linearGradient id="light-ring" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#4DE8FF"/>
      <stop offset=".22" stop-color="#46C8FF"/>
      <stop offset=".4" stop-color="#398CFF"/>
      <stop offset=".58" stop-color="#875CFF"/>
      <stop offset=".78" stop-color="#F34FD8"/>
      <stop offset="1" stop-color="#FF5E78"/>
    </linearGradient>
    <linearGradient id="app-icon" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#726BEA"/>
      <stop offset=".52" stop-color="#5B55D6"/>
      <stop offset="1" stop-color="#413BA9"/>
    </linearGradient>
    <pattern id="input-dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="1.05" fill="#FFFFFF" opacity=".42"/>
    </pattern>
    <filter id="output-glow" x="-500%" y="-500%" width="1000%" height="1000%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1280" height="360" rx="18" fill="#000000"/>
  <rect width="1280" height="360" rx="18" fill="url(#input-dots)"/>

  <circle cx="1290" cy="180" r="300" fill="#000000" stroke="#000000" stroke-width="90"/>
  <circle cx="1290" cy="180" r="300" fill="none" stroke="url(#light-ring)" stroke-width="54" opacity=".96"/>

  <g fill="#FFFFFF" opacity=".77" filter="url(#output-glow)">
    <circle cx="1052" cy="180" r="2.2"/>
    <circle cx="1098" cy="180" r="2.2"/>
    <circle cx="1144" cy="180" r="2.2"/>
    <circle cx="1190" cy="180" r="2.2"/>
    <circle cx="1236" cy="180" r="2.2"/>
  </g>

  <g transform="translate(58 40)">
    <rect width="48" height="48" rx="12" fill="url(#app-icon)"/>
    <rect x="13" y="24" width="6" height="14" rx="3" fill="#FFFFFF" opacity=".72"/>
    <rect x="21" y="11" width="6" height="27" rx="3" fill="#FFFFFF"/>
    <rect x="29" y="18" width="6" height="20" rx="3" fill="#FFFFFF" opacity=".86"/>
  </g>
  <text x="120" y="74" fill="#F7F7F8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="32" font-weight="700" letter-spacing="-1">SignalDesk</text>
  <text x="58" y="210" fill="#F7F7F8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="76" font-weight="600" letter-spacing="-2.7" word-spacing="7">filter the slop</text>
  <text x="60" y="254" fill="#D0CDD5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="400">clarified and curated X searches and filters</text>
</svg>
